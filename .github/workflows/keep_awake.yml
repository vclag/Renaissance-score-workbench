name: Keep App Awake

# Streamlit Community Cloud's free tier puts an app to sleep after a
# period with no incoming traffic -- the next visitor then has to wait
# through a real cold start.
#
# ---------------------------------------------------------------------
# REVISION 2, replacing the plain-curl version: confirmed directly
# (2026-09-11, via a real browser visit while the app was asleep) that
# the curl-based version below was NOT actually working, despite every
# scheduled run reporting HTTP 200 success for two days straight. Root
# cause: the sleeping-app page Streamlit Cloud serves is a JavaScript
# single-page app -- on a real visit it runs through a state machine
# (`INITIAL -> ... -> BOOTING -> ready`, watched directly in the
# browser console) driven by a SEQUENCE of its own API calls
# (`/api/v2/app/disambiguate`, `/api/v2/app/context`,
# `POST /api/v1/app/event/open`, `/api/v2/app/status`) that only fire
# once that JS actually executes. `curl`, even with cookies handled
# correctly (revision 1's own fix), only ever fetches the static HTML/
# CSS/JS shell of that same page -- it never executes the JavaScript,
# so it never fires the real wake sequence. Every prior "successful"
# run was curl faithfully re-downloading the sleeping-app placeholder,
# not a real visitor keeping the app alive -- which is exactly why the
# user found it asleep despite 10/10 green runs.
#
# Fix: a real (headless) browser via Playwright, which runs the actual
# JS and therefore the actual wake sequence, the same as any real
# visitor's browser. Confirmed directly this time: navigating with a
# real browser to the sleeping app took ~60-70s to reach genuine
# rendered content (the page's own title and body text), not just an
# HTTP 200 -- this workflow waits for that same real content, not a
# status code, before calling itself successful.
# ---------------------------------------------------------------------
#
# Every 6 hours is a comfortable safety margin under whatever the real
# sleep threshold is (not precisely documented by Streamlit, community
# reports range from about a day to about a week of total silence).
#
# Free to run indefinitely: GitHub Actions minutes are unlimited for
# public repos; a headless Chromium run here takes well under a minute.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:  # manual trigger, e.g. to test this works right after adding it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (Chromium only)
        run: |
          npm init -y > /dev/null
          npm install playwright@1.48.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Visit the app with a real browser and wait for it to actually wake up
        run: |
          cat > wake.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const url = 'https://renaissance-polyphony-research-toolkit.streamlit.app/';

            console.log(`Visiting ${url} ...`);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });

            // ---------------------------------------------------------
            // REVISION 3: the REAL bug, found 2026-09-17 after raising
            // the timeout (360s -> 600s, see git history) made literally
            // NO difference -- every run still failed at exactly the new
            // timeout, with the failure screenshot STILL showing the app
            // fully, correctly loaded. That contradiction (content is
            // there, wait never resolves, no matter how long) meant this
            // was never a slow-cold-start problem -- confirmed directly
            // by inspecting the live app's DOM (Claude Browser tool):
            // the app's real content -- including this exact title text
            // -- lives inside a same-origin IFRAME
            // (`https://<app>/~/+/`), not the top-level document.
            // `page.getByText()` only ever searches the main frame, so
            // it was NEVER going to find this text, at any timeout
            // length -- every "failure" since the 2026-09-11 reboot
            // (which apparently changed Streamlit Cloud's serving
            // architecture for this app to this iframe-wrapped form)
            // was this same structural miss, not a real problem with the
            // app or its wake time.
            //
            // Fix: search EVERY frame (main + iframes), not just the
            // main page -- robust regardless of whether Streamlit Cloud
            // wraps the app in an iframe or not (a detail of their own
            // platform, not something this workflow should have to
            // assume stays fixed).
            const TARGET_TEXT = 'Renaissance Polyphony Research Toolkit';
            const TIMEOUT_MS = 600000;
            const start = Date.now();

            async function findVisibleAcrossFrames() {
              for (const frame of page.frames()) {
                try {
                  if (await frame.getByText(TARGET_TEXT).first().isVisible()) {
                    return frame.url();
                  }
                } catch (e) {
                  // a frame can detach/navigate mid-check -- just skip it
                }
              }
              return null;
            }

            const logProgress = setInterval(() => {
              console.log(`  ...still waiting, ${Math.round((Date.now() - start) / 1000)}s elapsed (${page.frames().length} frame(s) currently)`);
            }, 15000);

            let foundIn = null;
            while (Date.now() - start < TIMEOUT_MS) {
              foundIn = await findVisibleAcrossFrames();
              if (foundIn) break;
              await page.waitForTimeout(1000);
            }
            clearInterval(logProgress);

            if (foundIn) {
              console.log(`SUCCESS: real app content loaded after ${Math.round((Date.now() - start) / 1000)}s (found in frame: ${foundIn}) -- app is awake.`);
            } else {
              const frameUrls = page.frames().map(f => f.url()).join(', ');
              console.log(`FAILED: app content never appeared within 600s in any frame. Page title was: "${await page.title()}". Frames seen: ${frameUrls}`);
              await page.screenshot({ path: 'failure.png', fullPage: true });
              await browser.close();
              process.exit(1);
            }
            await browser.close();
          })();
          EOF
          node wake.js

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wake-failure-screenshot
          path: failure.png
          retention-days: 5
